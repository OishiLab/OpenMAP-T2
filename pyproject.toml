[project]
name = "openmap-t2"
version = "0.1.0"
description = "Whole-brain parcellation of T2-weighted MRI into 280 anatomical regions"
requires-python = ">=3.11"
dependencies = [
    "nibabel==5.4.2",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "scikit-image==0.25.2",
    "SimpleITK==2.5.5",
    "torch>=2.12.0",
    "tqdm==4.68.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
